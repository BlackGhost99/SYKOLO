services:
  - type: web
    name: yem-staging
    runtime: docker
    repo: https://github.com/BlackGhost99/SYKOLO
    branch: staging
    region: frankfurt
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /readyz
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: staging
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: MFA_ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: yem-db-staging
          property: connectionString
databases:
  - name: yem-db-staging
    databaseName: yem_staging
    user: yem_staging
    region: frankfurt
    postgresMajorVersion: "17"
    plan: 0.1c-256mb
    diskSizeGB: 1
    ipAllowList: []
