plugins { id 'com.android.application' }

// Firebase configuration has project identifiers, not service-account credentials.
// Builds without it remain usable for foreground alerts and web functionality.
if (file('google-services.json').isFile()) {
    apply plugin: 'com.google.gms.google-services'
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:35.2.0')
    implementation 'com.google.firebase:firebase-messaging'
}

def signingNames = ['YEM_ANDROID_KEYSTORE_PATH', 'YEM_ANDROID_KEYSTORE_PASSWORD', 'YEM_ANDROID_KEY_ALIAS', 'YEM_ANDROID_KEY_PASSWORD']
def releaseSigningReady = signingNames.every { System.getenv(it) }
def releaseRequested = gradle.startParameter.taskNames.any { it.toLowerCase(java.util.Locale.ROOT).contains('release') }
if (releaseRequested && (!releaseSigningReady || !file('google-services.json').isFile())) {
    throw new GradleException('Release requires Firebase configuration and the private YEM signing key.')
}

android {
    namespace 'com.bwetek.yem.parents'
    compileSdk 35
    defaultConfig {
        applicationId 'com.bwetek.yem.parents'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile file(System.getenv('YEM_ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('YEM_ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('YEM_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('YEM_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (releaseSigningReady) signingConfig signingConfigs.release
            debuggable false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main.res.srcDir(layout.buildDirectory.dir("generated/yemRes"))
}

tasks.register("copyYemLogo", Copy) {
    from(rootProject.file("../frontend/assets/yem-brand.webp"))
    into(layout.buildDirectory.dir("generated/yemRes/drawable-nodpi"))
    rename { "yem_brand.webp" }
}
tasks.named("preBuild").configure { dependsOn(tasks.named("copyYemLogo")) }
