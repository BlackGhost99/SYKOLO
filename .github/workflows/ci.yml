name: Validate YEM
on:
  push:
    branches: [main, staging, "feat/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: yem_test
          POSTGRES_USER: yem_test
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: --health-cmd="pg_isready -U yem_test -d yem_test" --health-interval=5s --health-timeout=3s --health-retries=10
    env:
      APP_ENV: test
      DATABASE_URL: postgres://yem_test:ci-only-password@localhost:5432/yem_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: npm test
      - run: npm run build
      - run: python backend/manage.py check
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python backend/manage.py migrate --noinput
      - run: python backend/manage.py test pedagogy accounts institutions
      - name: Verify production settings fail closed
        env:
          APP_ENV: production
          DJANGO_SECRET_KEY: ci-validation-only-not-a-runtime-secret-abcdefghijklmnopqrstuvwxyz123456789
          DJANGO_ALLOWED_HOSTS: ci.example.test
          MFA_ENCRYPTION_KEY: ci-not-a-secret-totp-abcdefghijklmnopqrstuvwxyz123456
        run: python backend/manage.py check --deploy --fail-level WARNING
      - run: docker build -t yem:ci .
      - name: Smoke test Docker with PostgreSQL
        run: |
          docker run -d --name yem-ci --network host -e APP_ENV=staging -e PORT=8000 -e DATABASE_URL="$DATABASE_URL" -e DJANGO_ALLOWED_HOSTS=127.0.0.1 -e DJANGO_SECRET_KEY=ci-container-only-not-a-runtime-secret-abcdefghijklmnopqrstuvwxyz123456789 -e MFA_ENCRYPTION_KEY=ci-not-a-secret-totp-abcdefghijklmnopqrstuvwxyz123456 yem:ci
          for attempt in $(seq 1 30); do
            if curl -fsS -H 'X-Forwarded-Proto: https' http://127.0.0.1:8000/readyz; then break; fi
            sleep 2
          done
          curl -fsS -H 'X-Forwarded-Proto: https' http://127.0.0.1:8000/readyz
          curl -fsS -H 'X-Forwarded-Proto: https' http://127.0.0.1:8000/healthz
          curl -fsS -H 'X-Forwarded-Proto: https' http://127.0.0.1:8000/ > /dev/null
      - name: Container logs on failure
        if: failure()
        run: docker logs yem-ci || true
      - name: Validate Render blueprint schemas
        run: |
          pip install jsonschema pyyaml
          python scripts/validate_blueprints.py
